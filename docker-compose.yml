services:

  db:
    image: postgres:16
    container_name: ucm-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ucmcrm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm123
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d ucmcrm"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ucmcrm

  backend:
    build:
      context: ./backend
    container_name: ucm-crm-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "10000:10000"
    expose:
      - "8000"
    networks:
      - ucmcrm

  frontend:
    image: nginx:alpine
    container_name: ucm-crm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ucmcrm

volumes:
  db_data:

networks:
  ucmcrm:
    driver: bridge
